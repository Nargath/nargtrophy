# NargTrophy banners
#
# Every banner is defined here. Adding a creature (vanilla or modded) is an edit to this file.
# Values (radius, bonuses, costs) are server-synced and reload when the file is saved.
# Adding or removing banners needs a restart, and every player needs the same banner list.
#
# Each banner is built in layers, weakest first:
#   built-in values < defaults.permanent / defaults.portable < defaults.biomes.<biome> < the entry itself
# and `availability` sets kill targets; the trophy cost comes from them and the creature's real drop chance.
# A modded creature usually needs only: id, creature, trophy, biome, availability.
#
# Bosses are left out on purpose: their trophies have vanilla uses (Forsaken powers).
# Also left out: unique or quest creatures with a guaranteed trophy (Hildir's bosses, Kvastur, White Deer).
# Availability tiers are a first balance pass. Biomes marked "unverified"
# are guesses. All numbers are placeholders until the balance pass.
#
# alsoMatches lists technical copies of the SAME creature (same name and trophy): sleeping, frozen,
# biome and loadout variants. Never related creatures: those get their own banner.
#
# Other files: every banners.<name>.yml in this folder is loaded too (e.g. one per mod). They use the
# defaults below and can start with  requiresMod: <plugin GUID>  to be skipped quietly when that mod
# isn't installed. The nt_trophies console command writes suggested lines to suggested-banners.yml.

# Creatures deliberately left without a banner, so nt_trophies doesn't suggest them (bosses are never
# suggested). Unique or quest creatures, a prisoner, and test prefabs. Any banner file can have this list.
noBanner: [ BogWitchKvastur, Deer_White, DvergerDeepNorth, DvergerTest, TrainingDummy,
            Fenring_Cultist_Hildir, Fenring_Cultist_Hildir_nochest, GoblinBruteBros, GoblinBruteBros_nochest,
            GoblinShaman_Hildir, GoblinShaman_Hildir_nochest, Skeleton_Hildir, Skeleton_Hildir_nochest ]

defaults:
  permanent:               # trophy banner: hammer piece, always on
    radius: 30             # metres, measured flat (like a ward)
    damageBonus: 0.15      # +15% damage dealt to the creature
    damageReduction: 0.15  # -15% damage taken from the creature
    station: piece_workbench
    sourcePrefab: piece_banner01   # vanilla piece cloned for the stand-in look
    # The creature's trophy model on the front of the crossbar, facing out like on a wall item stand.
    # size = longest side in metres; offset and rotation ([x, y, z], metres and degrees) adjust the automatic placement. Startup only.
    trophyMount: { enabled: true, size: 0.9, offset: [0, 0, 0], rotation: [0, 0, 0] }
    # Upgrades: hover a built trophy banner and press E to pay for the next level. Each level adds these.
    # Cost per level = trophies (from the availability kill targets below) + the banner's extra materials, times x1, x2, x4 for
    # levels 2, 3, 4 (vanilla's item upgrade formula). Deconstructing refunds everything spent on upgrades.
    upgrade: { maxLevel: 3, damageBonus: 0.05, damageReduction: 0.03, radius: 3 }
  portable:                # war standard: reusable item that plants a banner for a while
    radius: 12
    damageBonus: 0.30
    damageReduction: 0.25
    duration: 300          # seconds the planted standard lasts
    cooldown: 900          # seconds, measured from planting
    station: piece_workbench
    stationLevel: 1
    sourcePrefab: piece_banner01   # look of the planted standard (shown smaller, on a pole)
    trophyMount: { enabled: true, size: 0.9, offset: [0, 0, 0], rotation: [0, 0, 0] }
    # Upgrades: vanilla item quality, at the war standard's crafting station (each level needs one more station
    # level). Same cost formula as above. Only damage, reduction and radius improve; duration and cooldown don't.
    upgrade: { maxLevel: 3, damageBonus: 0.05, damageReduction: 0.03, radius: 2 }

  # Availability = how easy a creature is to find and kill (spawn rate, nests and villages, difficulty), set by
  # hand per creature. Each tier is a KILL target; the mod reads the creature's real trophy drop chance and works
  # out the trophy cost: trophies = kills x drop chance, rounded, at least 1.
  #   permanent = kills for a trophy banner, portable = for a war standard,
  #   upgrade = kills per upgrade step (x1, x2, x4 for levels 2, 3, 4), both kinds.
  # An entry can still set  permanent: { trophies: N }  (or portable / upgrade) to fix its own count.
  availability:
    abundant: { permanent: 20, portable: 25, upgrade: 10 }   # everywhere: Greydwarf, Deer, Fuling, Seeker
    common:   { permanent: 12, portable: 15, upgrade: 6 }    # met often: Draugr, Wolf, Lox
    scarce:   { permanent: 6,  portable: 8,  upgrade: 3 }    # few or hard: Troll, Stone Golem, Abomination
    rare:     { permanent: 3,  portable: 4,  upgrade: 2 }    # rarely met: Serpent, Bonemaw

  # Per biome: extra materials on top of the trophies, and a cloth colour used when an entry has no tint.
  biomes:
    Meadows:
      tint: "#7a8a3a"
      permanent: { extra: [ { item: Wood, amount: 10 } ] }
      portable:  { extra: [ { item: LeatherScraps, amount: 5 } ] }
    BlackForest:
      tint: "#3f5a34"
      permanent: { extra: [ { item: Wood, amount: 10 } ] }
      portable:  { extra: [ { item: Resin, amount: 10 } ] }
    Swamp:
      tint: "#4f5a3a"
      permanent: { extra: [ { item: ElderBark, amount: 10 } ] }
      portable:  { extra: [ { item: Guck, amount: 5 } ] }
    Mountain:
      tint: "#9fb3c8"
      permanent: { extra: [ { item: FineWood, amount: 10 } ] }
      portable:  { extra: [ { item: WolfPelt, amount: 3 } ] }
    Plains:
      tint: "#c2a25a"
      permanent: { extra: [ { item: FineWood, amount: 10 } ] }
      portable:  { extra: [ { item: LinenThread, amount: 5 } ] }
    Mistlands:
      tint: "#5b4a7a"
      permanent: { extra: [ { item: YggdrasilWood, amount: 10 } ] }
      portable:  { extra: [ { item: Softtissue, amount: 5 } ] }
    Ashlands:
      tint: "#7a2e1f"
      permanent: { extra: [ { item: Blackwood, amount: 10 } ] }
      portable:  { extra: [ { item: Grausten, amount: 10 } ] }
    DeepNorth:
      tint: "#c8d8e8"
      # TODO: pick Deep North materials. Until then these cost trophies only.
    Ocean:
      tint: "#2f5f7a"
      permanent: { extra: [ { item: FineWood, amount: 10 } ] }
      portable:  { extra: [ { item: Chitin, amount: 5 } ] }

